# 只给这台电脑用。复制为 config.yaml。不要提交 config.yaml。
# 不占用 Fisher 的 8080。

# 本机 PAC：校外流量走洛杉矶服务器。start.sh 会挂着 loop。
# ssh = 117.55.227.80。隧道内三层加密 + WebSocket 伪装，不是明文 CONNECT。
# subscribe = 走 loom-share 控制面订阅（要填 subscribe_url，本机要有 mihomo）
